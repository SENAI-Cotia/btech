<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecreAtiva - Home</title>
    <link rel="icon" type="image/x-icon" th:href="@{/image/icons8-controle-de-video-game-50.ico}">
    <link rel="stylesheet" th:href="@{/css/admhome.css}">
</head>

<body>

<div class="app-container">

    <nav class="icon">

        <div class="nav">
            <div class="nav-botao" id="btn-clubes">
                <img th:src="@{https://img.icons8.com/ios-filled/50/ffffff/conference-call.png}" alt="Clubes">
                <span>Clubes</span>
            </div>
        </div>

        <div class="nav-botao">
            <button class="logout-botao">
                <span>
                    <a th:href="@{/login}">
                        <img th:src="@{https://img.icons8.com/ios-glyphs/30/ffffff/shutdown.png}" alt="Sair">
                    </a>
                </span>
            </button>
        </div>

    </nav>

    <aside class="sidebar">
        <section class="painel-criar">
            <h1 class="painel-titulo">Criar o Clube</h1>
            <form th:action="@{/admin/clube/salvar}" method="post"
                  enctype="multipart/form-data" th:object="${novoClube}">
                <div class="form-container">
                    <div class="box">
                        <label>Nome do Clube:</label>
                        <input type="text" th:field="*{nome}" required>
                    </div>
                    <div class="box">
                        <label>Descrição:</label>
                        <input type="text" th:field="*{descricao}">
                    </div>
                    <div class="box">
                        <label><strong>Dia(s):</strong></label>
                        <input type="text" th:field="*{diaSemana}">
                    </div>
                    <div class="box">
                        <label>Horário:</label>
                        <input type="text" th:field="*{horario}">
                    </div>
                    <div class="box">
                        <label>Imagem:</label>
                        <div class="upload-container">
                            <input type="file" id="imagem" name="imagemFile" accept="image/*" hidden>
                            <label for="imagem" class="btn-upload">+</label>
                            <span id="nome-arquivo">Nenhum arquivo</span>
                        </div>
                    </div>
                    <button type="submit" class="botaoCriar">CRIAR</button>
                </div>
            </form>
        </section>

        <!-- FORMULÁRIO DE EDIÇÃO -->
        <section class="painel-editar" style="display:none;">
            <h1 class="painel-titulo">Editar Clube</h1>
            <form id="form-editar" method="post" enctype="multipart/form-data">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-container">
                    ...
                </div>
            </form>

            <div class="form-container">
                    <div class="box">
                        <label>Nome do Clube:</label>
                        <input type="text" id="edit-nome" name="nome" required>
                    </div>
                    <div class="box">
                        <label>Descrição:</label>
                        <input type="text" id="edit-descricao" name="descricao">
                    </div>
                    <div class="box">
                        <label><strong>Dia(s):</strong></label>
                        <input type="text" id="edit-diaSemana" name="diaSemana">
                    </div>
                    <div class="box">
                        <label>Horário:</label>
                        <input type="text" id="edit-horario" name="horario">
                    </div>
                    <div class="box">
                        <label>Imagem:</label>
                        <div class="upload-container">
                            <input type="file" id="imagem-editar" name="imagemFile" accept="image/*" hidden>
                            <label for="imagem-editar" class="btn-upload">+</label>
                            <span id="nome-arquivo-editar">Nenhum arquivo</span>
                        </div>
                    </div>
                    <button type="submit" class="botaoCriar">SALVAR</button>
                </div>
            </form>
        </section>
    </aside>

    <aside class="sidebar-inscricao">
        <section class="painel-inscrever">

            <div class="sidebar-content">

                <img id="sidebar-img"
                     th:src="@{/image/default.png}"
                     alt="Imagem do Clube">

                <h2 id="sidebar-titulo">Selecione um clube</h2>

                <p id="sidebar-descricao"></p>

                <div class="info-grupo">
                    <h3>Dias</h3>
                    <p id="sidebar-dias">--</p>
                </div>

                <div class="info-grupo">
                    <h3>Horário:</h3>
                    <p id="sidebar-horario">--</p>
                </div>

                <button id="btn-editar" class="btn-secondary">Editar</button>
                <button id="btn-excluir" class="btn-secondary">Excluir</button>

            </div>
        </section>
    </aside>

    <main class="main">

        <h2 class="tituloHome">CLUBES:</h2>

        <div class="cards-grid">

            <div class="card"
                 th:each="clube : ${clubes}"
                 th:data-dias="${clube.diaSemana}"
                 th:data-horario="${clube.horario}"
                 th:data-id="${clube.id}">
                <img th:src="@{/image/} + ${clube.imagem}"
                     class="card-image"
                     th:alt="${clube.nome}"
                     onerror="this.src='/image/default.png'">
                <div class="card-body">
                    <div class="card-texto">
                        <h3 th:text="${clube.nome}">Nome do Clube</h3>
                        <p th:text="${clube.descricao}">Descrição</p>
                    </div>
                </div>
            </div>

            <button class="card-add">
                <div class="icone">+</div>
                <p>Criar novo Clube</p>
            </button>

        </div>

    </main>

</div>

<script th:src="@{/javascript/interacoes.js}"></script>

</body>
</html>
