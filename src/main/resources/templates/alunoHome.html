<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecreAtiva - Home</title>
    <link rel="icon" type="image/x-icon" th:href="@{/image/icons8-controle-de-video-game-50.ico}">
    <link rel="stylesheet" th:href="@{/css/alunohome.css}">
</head>

<body>

<div class="app-container">

    <nav class="icon">

        <div class="nav">

            <div class="nav-botao" id="btn-clubes">

                <div class="img-icon">
                    <a th:href="@{/aluno/perfil}">
                        <img th:src="@{/image/icon-perfil.png}" alt="Perfil">
                    </a>
                </div>

                <span>Perfil</span>
            </div>

        </div>

        <div class="nav-botao">

            <button class="logout-botao">
                <span>
                    <a th:href="@{/login}">
                        <img th:src="@{/image/icons8-desligar-30.png}" alt="Sair">
                    </a>
                </span>
            </button>

        </div>

    </nav>

    <aside class="sidebar-inscricao">

        <section class="painel-inscrever">

            <div class="sidebar-content">

                <img id="sidebar-img"
                     th:src="@{/image/default.png}"
                     alt="Imagem do Clube">

                <h2 id="sidebar-titulo">Selecione um clube</h2>

                <p id="sidebar-descricao"></p>

                <div class="info-grupo">
                    <h3>Dias</h3>
                    <p id="sidebar-dias">--</p>
                </div>

                <div class="info-grupo">
                    <h3>Horário:</h3>
                    <p id="sidebar-horario">--</p>
                </div>

                <form id="form-matricula" method="post" th:action="@{/aluno/matricular/0}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" id="btn-inscrever" class="btn-primary">Inscrever-se</button>
                </form>

                <button id="btn-confirmar" class="btn-secondary">Fechar</button>

            </div>

        </section>

    </aside>

    <main class="main">

        <h2 class="tituloHome">CLUBES:</h2>

        <div class="cards-grid">

            <div class="card"
                 th:each="clube : ${clubes}"
                 th:data-dias="${clube.diaSemana}"
                 th:data-horario="${clube.horario}"
                 th:data-id="${clube.id}">
                <img th:src="@{/image/} + ${clube.imagem}"
                     class="card-image"
                     th:alt="${clube.nome}"
                     onerror="this.src='/image/default.png'">
                <div class="card-body">
                    <div class="card-texto">
                        <h3 th:text="${clube.nome}">Nome do Clube</h3>
                        <p th:text="${clube.descricao}">Descrição</p>
                    </div>
                </div>
            </div>

        </div>

    </main>

</div>

<script th:src="@{/javascript/interacoes.js}"></script>

</body>
</html>
